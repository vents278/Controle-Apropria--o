<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ERP Gestão</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <h2>ERP Gestão</h2>
      <p>Apropriação & Presença</p>
    </div>

    <form id="formLogin" onsubmit="realizarLogin(event)">
      <div class="form-group">
        <label>E-mail Corporativo:</label>
        <input type="email" id="loginEmail" placeholder="seu.email@empresa.com" required autofocus>
      </div>

      <div class="form-group">
        <label>Senha:</label>
        <input type="password" id="loginSenha" placeholder="••••••••" required>
      </div>

      <div id="loginErro" class="error-alert" style="display: none;"></div>

      <button type="submit" class="btn-primary full-width" style="margin-top: 10px;">Entrar no Sistema</button>
    </form>
  </div>

  <script>
    async function realizarLogin(e) {
      e.preventDefault();
      const erroDiv = document.getElementById("loginErro");
      erroDiv.style.display = "none";

      const email = document.getElementById("loginEmail").value;
      const senha = document.getElementById("loginSenha").value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, senha })
        });

        const data = await res.json();

        if (res.ok) {
          window.location.href = "/";
        } else {
          erroDiv.innerText = data.erro || "Falha na autenticação.";
          erroDiv.style.display = "block";
        }
      } catch (err) {
        erroDiv.innerText = "Erro ao conectar ao servidor.";
        erroDiv.style.display = "block";
      }
    }
  </script>
</body>
</html>
